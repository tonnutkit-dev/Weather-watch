<!doctype html><html lang="th"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content"/><meta name="theme-color" content="#070d19"/><meta name="apple-mobile-web-app-capable" content="yes"/><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/><meta name="description" content="Weather Watch — แผนที่อากาศ เรดาร์ฝน และฝุ่น สำหรับประเทศไทย"/><link rel="icon" href="%BASE_URL%favicon.svg"/><title>Weather Watch</title><script>/* Dark-first: first visit stores dark; later visits honour the saved choice. */try{var p=localStorage.getItem('ww-appearance');if(p===null){p='dark';localStorage.setItem('ww-appearance',p)}var t=p==='light'||p==='dark'?p:matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.dataset.theme=t;document.documentElement.style.colorScheme=t}catch(e){document.documentElement.dataset.theme='dark'}</script></head><body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body></html>

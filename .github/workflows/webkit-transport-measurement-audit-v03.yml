          git diff --exit-code "$WW_PRIOR_SHA" HEAD -- . ':(exclude)qa-transport-audit-v03' ':(exclude).github/workflows/webkit-transport-measurement-audit-v03.yml'
          test -z "$(git diff --name-status "$WW_PRIOR_SHA" HEAD | grep -Ev '^A[[:space:]]+(qa-transport-audit-v03/|\.github/workflows/webkit-transport-measurement-audit-v03\.yml$)' || true)"
          mkdir -p qa-transport-audit-v03/artifacts
          node --version > qa-transport-audit-v03/artifacts/node-version.txt
      - name: Validate local native HTTPS fixture and absolute deadline
        run: node qa-transport-audit-v03/fixture-validation.mjs qa-transport-audit-v03/artifacts/fixture-validation.json
      - name: Build exact locked candidate and same-runner frozen RC
        run: |

name: Weather Watch V0.3 P0 isolated deployed Owner QA
on:
  push:
    branches: [work/p0-reliability-correction-v03]
    paths: [qa-owner-v03/**, .github/workflows/owner-qa-v03.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deployed-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WW_E2E_BASE_URL: https://weather-watch-v03-p0-owner-qa-ton.tonnutkit.chatgpt.site/
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - name: Protect exact approved executable source and main
        run: |
          git diff --exit-code 4b3548fa49abd9475547fc6e8336a1b854ad6952 HEAD -- src package.json package-lock.json index.html vite.config.ts tests playwright.config.ts .github/workflows/pages.yml
          test "$(git rev-parse origin/main)" = 2036e2ac788cb31d25fd387cb40520ad95c408a6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Anonymous HTTPS, exact release and all deployed asset hashes
        run: node qa-owner-v03/verify-http.mjs
      - run: npx playwright install --with-deps chromium
        if: always()
      - name: Existing unmodified live browser regressions against new HTTPS site
        if: always()
        run: npm run test:e2e
      - name: Deployed Owner QA and source-expiry checks
        if: always()
        run: npx playwright test --config qa-owner-v03/playwright.config.ts
      - name: Publish actual deployed screenshots and failure traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: weather-watch-v03-p0-owner-qa-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
            qa-owner-v03/browser-report/
            qa-owner-v03/test-results/
            qa-owner-v03/raw/
          retention-days: 90

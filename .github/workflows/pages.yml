name: Weather Watch Pages QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

jobs:
  build:
    name: Validate and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WW_RELEASE_CHANNEL: production
    steps:
      - name: Checkout source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - name: Install lockfile dependencies
        run: npm ci
      - name: Strict TypeScript check
        run: npm run typecheck
      - name: Adapter and regression tests
        run: npm test
      - name: Build production application
        run: npm run build
      - name: Verify Pages assets and record public release metadata
        run: npm run verify:pages
      - name: Freeze exact release manifest
        run: node qa-rc-v03/artifact-manifest.mjs
      - name: Retain immutable production manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pages-release-manifest-${{ github.sha }}
          path: qa-rc-v03/artifacts/pages-manifest.json
          retention-days: 90
      - name: Install Chromium for production browser QA
        run: npx playwright install --with-deps chromium
      - name: Check production UI, live providers and offline behavior
        run: npm run test:e2e
      - name: Retain browser QA evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-qa-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - name: Upload production Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist
      - name: Report build failure
        if: failure()
        run: |
          echo '::error::Weather Watch validation/build failed. Deployment was not attempted; inspect the failed step and browser QA artifact.'
          echo '## Build failed — site was not deployed' >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Publish public QA
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy validated artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Record deployment
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          echo "## Weather Watch public QA" >> "$GITHUB_STEP_SUMMARY"
          echo "URL: $PAGE_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: $COMMIT_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Report deployment failure
        if: failure()
        run: |
          echo '::error::Pages deployment failed. Check Settings → Pages → Source: GitHub Actions, then inspect this job. No successful deployment is claimed.'
          echo '## Deployment failed — inspect Pages settings and job logs' >> "$GITHUB_STEP_SUMMARY"

  verify-live:
    name: Verify deployed HTTPS app
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact release
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Retrieve manifest from this exact build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pages-release-manifest-${{ github.sha }}
          path: qa-rc-v03/artifacts
      - name: Set up Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - name: Verify HTTPS and exact release SHA
        env:
          WW_RC_VERIFY_URL: https://tonnutkit-dev.github.io/Weather-watch/
        run: node scripts/verify_live_pages.mjs
      - name: Install reproducible browser QA dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test actual GitHub Pages website
        env:
          WW_E2E_BASE_URL: https://tonnutkit-dev.github.io/Weather-watch/
        run: npm run test:e2e
      - name: Retain deployed browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deployed-browser-qa-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - name: Report live verification failure
        if: failure()
        run: |
          echo '::error::Artifact publishing completed, but live website QA failed. Do not declare owner acceptance; inspect this job and deployed browser evidence.'
          echo '## Live QA failed — owner acceptance remains pending' >> "$GITHUB_STEP_SUMMARY"

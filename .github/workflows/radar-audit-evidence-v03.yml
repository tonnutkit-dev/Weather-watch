name: Weather Watch isolated P1 renderer evidence
on:
  push:
    branches: [work/radar-smooth-playback-v03]
    paths: [.github/workflows/radar-audit-evidence-v03.yml, qa-audit-evidence-v03/**]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: { node-version: 24, cache: npm }
      - name: Confirm unchanged shipping code
        run: |
          test "$(git rev-parse origin/main)" = 2036e2ac788cb31d25fd387cb40520ad95c408a6
          git diff --exit-code 8f137edc921d677cd3693229b670506495057cd2 HEAD -- src package.json package-lock.json vite.config.ts
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - name: LAB imagery and resource lifecycle, never deployed
        run: npx playwright test --config qa-audit-evidence-v03/playwright.config.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: radar-audit-lab-v03-${{ github.run_id }}
          path: qa-audit-evidence-v03/
          retention-days: 90

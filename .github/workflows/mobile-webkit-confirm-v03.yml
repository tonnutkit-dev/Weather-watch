name: Weather Watch mobile WebKit live confirmation
on:
  push:
    branches: [work/mobile-map-correction-v03]
    paths: [.github/workflows/mobile-webkit-confirm-v03.yml]
permissions: {contents: read}
jobs:
  webkit-live:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {fetch-depth: 0}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: 24, cache: npm}
      - name: Prove application identical to tested mobile source
        run: git diff --exit-code 0ed053acdcf1b4e477e9f988d257902de4c081e3 HEAD -- src package.json package-lock.json vite.config.ts qa-mobile-v03
      - run: npm ci && npm run typecheck && npm run build
      - run: npx playwright install --with-deps webkit
      - name: Original 45 second live provider threshold, zero retries
        run: npx playwright test --config qa-mobile-v03/playwright.config.ts --project webkit --grep 'live mobile'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mobile-webkit-live-${{ github.run_id }}
          path: |
            qa-mobile-v03/browser-report/
            qa-mobile-v03/test-results/
          retention-days: 90
